name: Build Barber SAEED APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip -q BARBER_SAEED_ready_for_github.zip -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project
        working-directory: project/mobile
        run: flutter create --platforms=android .
    
      - name: Build APK
        working-directory: project/mobile
        run: |
          flutter pub get
          flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BARBER-SAEED-APK
          path: project/mobile/build/app/outputs/flutter-apk/app-release.apk
